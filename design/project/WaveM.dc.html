<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFD12E","options":["#FFD12E","#EDBD1E","#3BE083","#C4F24A"],"section":"Color"},"peak":{"editor":"range","default":22,"min":10,"max":40,"step":1,"unit":"% H","section":"M wave"},"valley":{"editor":"range","default":76,"min":60,"max":86,"step":1,"unit":"% H","section":"M wave"},"roundness":{"editor":"range","default":10,"min":6,"max":16,"step":0.5,"unit":"% H","section":"M wave"},"lean":{"editor":"range","default":100,"min":70,"max":100,"step":5,"unit":"% of slant","section":"M wave"},"cut":{"editor":"range","default":7,"min":4,"max":10,"step":0.5,"unit":"% H","section":"M wave"},"slant":{"editor":"range","default":19,"min":8,"max":28,"step":1,"unit":"°","section":"Panels"},"panelWidth":{"editor":"range","default":62,"min":50,"max":76,"step":1,"unit":"% H","section":"Panels"},"cornerRadius":{"editor":"range","default":6,"min":0,"max":10,"step":0.5,"unit":"% H","section":"Panels"},"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  pieces(o, panels, wave) {
    const H = 400;
    const a = o.slant * Math.PI / 180;
    const k = Math.tan(a), sa = Math.sin(a), ca = Math.cos(a);
    const s = k * H;
    const W = o.panelWidth / 100 * H;
    const G = o.cut / 100 * H;
    const h = G / 2;
    const gh = G / ca;
    const P = W + gh;
    const r = o.cornerRadius / 100 * H;
    const center = wave({ H, k, W, h, gh, P });
    const f = (n) => String(Math.round(n * 10) / 10);
    const pt = (p) => f(p[0]) + ' ' + f(p[1]);
    const sample = (u0, u1, side) => {
      const out = [];
      for (let u = u0; u <= u1; u += 1) {
        const c = center(u);
        let tx = c[2], ty = c[3];
        const n = Math.hypot(tx, ty); tx /= n; ty /= n;
        out.push(side < 0 ? [c[0] + ty * h, c[1] - tx * h] : [c[0] - ty * h, c[1] + tx * h]);
      }
      return out;
    };
    const cross = (pts, g, from) => {
      for (let j = Math.max(1, from); j < pts.length; j++) {
        const g0 = g(pts[j - 1]), g1 = g(pts[j]);
        if (g0 < 0 && g1 >= 0) {
          const t = g0 / (g0 - g1);
          return { j, p: [pts[j - 1][0] + t * (pts[j][0] - pts[j - 1][0]), pts[j - 1][1] + t * (pts[j][1] - pts[j - 1][1])] };
        }
      }
      return null;
    };
    const corner = (V, u1, u2) => {
      const c = Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1]));
      const d = r / Math.tan(Math.acos(c) / 2);
      return 'L' + pt([V[0] + u1[0] * d, V[1] + u1[1] * d]) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + pt([V[0] + u2[0] * d, V[1] + u2[1] * d]);
    };
    const up = [sa, -ca], down = [-sa, ca], left = [-1, 0], right = [1, 0];
    const paths = [];
    for (let i = 0; i < panels; i++) {
      const ox = i * P;
      const gL = (q) => q[0] - (ox + k * (H - q[1]));
      const gR = (q) => q[0] - (ox + W + k * (H - q[1]));
      const uPts = sample(ox - gh / 2 - 40, ox + W + s + gh / 2 + 40, -1);
      const uL = cross(uPts, gL, 1);
      const uR = uL && cross(uPts, gR, uL.j);
      const lPts = sample(ox - gh / 2 - 40, ox + W + s + gh / 2 + 40, 1);
      const lL = cross(lPts, gL, 1);
      const lR = lL && cross(lPts, gR, lL.j);
      if (!uR || !lR) { paths.push('', ''); continue; }
      let d = 'M' + pt(uL.p) + corner([ox + s, 0], down, right) + corner([ox + W + s, 0], left, down) + 'L' + pt(uR.p);
      for (let j = uR.j - 1; j >= uL.j; j--) d += 'L' + pt(uPts[j]);
      paths.push(d + 'Z');
      d = 'M' + pt(lR.p) + corner([ox + W, H], up, left) + corner([ox, H], right, up) + 'L' + pt(lL.p);
      for (let j = lL.j; j < lR.j; j++) d += 'L' + pt(lPts[j]);
      paths.push(d + 'Z');
    }
    return { paths, vw: (panels - 1) * P + W + s, vh: H };
  }

  sineWave(o) {
    return (g) => {
      const A = o.amplitude / 100 * g.H;
      const yc = o.waveHeight / 100 * g.H;
      const w = 2 * Math.PI / g.P;
      const xc0 = g.W + g.gh / 2 + g.k * (g.H - (yc + A)) - g.P / 2;
      return (x) => {
        const t = w * (x - xc0);
        return [x, yc - A * Math.cos(t), 1, A * w * Math.sin(t)];
      };
    };
  }

  mWave(o) {
    return (g) => {
      const H = g.H, W = g.W, P = g.P, half = P / 2, h = g.h;
      const sig = g.k * o.lean / 100;
      const yTop = o.peak / 100 * H;
      const yBot = Math.max(o.valley, o.peak + 10) / 100 * H;
      let Rc = Math.max(o.roundness * 0.9 / 100 * H, h + 4);
      let Rt = Math.max(o.roundness / 100 * H, h + 4);
      const thMax = Math.min(72 * Math.PI / 180, Math.atan(0.9 / Math.max(sig, 1e-6)));
      const span = yBot - yTop;
      const lim = 0.95 * half / ((Rc + Rt) * Math.sin(thMax));
      if (lim < 1) { Rc *= lim; Rt *= lim; }
      const gfn = (t) => half * Math.tan(t) - span - (Rc + Rt) * (1 / Math.cos(t) - 1);
      let lo = Math.atan(span / half), hi = thMax, th = hi;
      if (lo < hi && gfn(hi) >= 0) {
        for (let it = 0; it < 60; it++) { const mid = (lo + hi) / 2; if (gfn(mid) < 0) lo = mid; else hi = mid; }
        th = (lo + hi) / 2;
      } else {
        const need = Math.max(0, (half * Math.tan(th) - span) / (1 / Math.cos(th) - 1));
        const sc = need / (Rc + Rt);
        Rc = Math.max(Rc * sc, h + 4); Rt = Math.max(Rt * sc, h + 4);
      }
      const tn = Math.tan(th), sn = Math.sin(th), sec = 1 / Math.cos(th);
      const yPk = yTop - Rc * (sec - 1);
      const yVl = yPk + half * tn;
      const cY = yPk + Rc * sec, tY = yVl - Rt * sec;
      const cW = Rc * sn, tW = Rt * sn;
      const off = (g.k - sig) * (H - (tY + Rt));
      const prof = (v) => {
        if (v <= cW) { const q = Math.sqrt(Rc * Rc - v * v); return [cY - q, v / q]; }
        const vt = half - v;
        if (vt <= tW) { const q = Math.sqrt(Rt * Rt - vt * vt); return [tY + q, vt / q]; }
        return [yPk + v * tn, tn];
      };
      return (u) => {
        const d = ((u - W / 2) % P + P) % P;
        let y, yp;
        if (d > half) { const pr = prof(P - d); y = pr[0]; yp = -pr[1]; } else { const pr = prof(d); y = pr[0]; yp = pr[1]; }
        return [u + sig * (H - y) + off, y, 1 - sig * yp, yp];
      };
    };
  }

  renderVals() {
    const p = this.props;
    const o = {
      peak: p.peak ?? 22,
      valley: p.valley ?? 76,
      roundness: p.roundness ?? 10,
      lean: p.lean ?? 100,
      cut: p.cut ?? 7,
      slant: p.slant ?? 19,
      panelWidth: p.panelWidth ?? 62,
      cornerRadius: p.cornerRadius ?? 6
    };
    const t1o = { slant: 19, panelWidth: 62, cut: 7, amplitude: 11, waveHeight: 47, cornerRadius: 6 };
    const t1 = this.pieces(t1o, 2, this.sineWave(t1o));
    const build = (oo) => this.pieces(oo, 2, this.mWave(oo));
    const main = build(o);
    const so = Object.assign({}, o, { cut: Math.min(o.cut * 1.5, 12), cornerRadius: o.cornerRadius * 0.5 });
    const small = build(so);
    const sA = build(Object.assign({}, o, { peak: 30, valley: 70 }));
    const sB = build(Object.assign({}, o, { peak: 22, valley: 76 }));
    const sC = build(Object.assign({}, o, { peak: 16, valley: 80 }));
    const r2 = (n) => Math.round(n * 100) / 100;
    const pack = (m) => ({ vb: '0 0 ' + r2(m.vw) + ' ' + m.vh, p1: m.paths[0], p2: m.paths[1], p3: m.paths[2] || '', p4: m.paths[3] || '' });
    const byH = (m, hh) => ({ w: r2(hh * m.vw / m.vh), h: hh });
    return {
      accent: p.accent ?? '#FFD12E',
      t1: pack(t1),
      m: pack(main),
      ms: pack(small),
      sA: pack(sA), sB: pack(sB), sC: pack(sC),
      hero1: byH(t1, 228), mini1: byH(t1, 50),
      hero2: byH(main, 228), mini2: byH(main, 50),
      ser: byH(sB, 110),
      tile: byH(main, 110),
      s40: byH(main, 40), s28: byH(main, 28), s20: byH(main, 20), s14: byH(main, 14),
      t40: byH(small, 40), t28: byH(small, 28), t20: byH(small, 20), t14: byH(small, 14)
    };
  }
}
</script>
