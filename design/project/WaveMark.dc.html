<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFD12E","options":["#FFD12E","#EDBD1E","#3BE083","#C4F24A"],"section":"Color"},"slant":{"editor":"range","default":19,"min":8,"max":28,"step":1,"unit":"°","section":"Geometry"},"panelWidth":{"editor":"range","default":62,"min":48,"max":80,"step":1,"unit":"% H","section":"Geometry"},"cut":{"editor":"range","default":7,"min":4,"max":10,"step":0.5,"unit":"% H","section":"Geometry"},"amplitude":{"editor":"range","default":11,"min":5,"max":15,"step":0.5,"unit":"% H","section":"Geometry"},"waveHeight":{"editor":"range","default":47,"min":38,"max":58,"step":1,"unit":"% H","section":"Geometry"},"cornerRadius":{"editor":"range","default":6,"min":0,"max":12,"step":0.5,"unit":"% H","section":"Geometry"},"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  buildMark(o, panels) {
    const H = 400;
    const a = o.slant * Math.PI / 180;
    const k = Math.tan(a), sa = Math.sin(a), ca = Math.cos(a);
    const s = k * H;
    const W = o.panelWidth / 100 * H;
    const G = o.cut / 100 * H;
    const h = G / 2;
    const gh = G / ca;
    const P = W + gh;
    const A = o.amplitude / 100 * H;
    const yc = o.waveHeight / 100 * H;
    const r = o.cornerRadius / 100 * H;
    const w = 2 * Math.PI / P;
    const xc0 = W + gh / 2 + k * (H - (yc + A)) - P / 2;
    const f = (n) => String(Math.round(n * 100) / 100);
    const pt = (p) => f(p[0]) + ' ' + f(p[1]);
    const sample = (x0, x1, side) => {
      const out = [];
      for (let x = x0; x <= x1; x += 2) {
        const t = w * (x - xc0);
        const y = yc - A * Math.cos(t);
        const dy = A * w * Math.sin(t);
        const n = Math.sqrt(1 + dy * dy);
        out.push(side < 0 ? [x + dy * h / n, y - h / n] : [x - dy * h / n, y + h / n]);
      }
      return out;
    };
    const cross = (pts, g, from) => {
      for (let j = Math.max(1, from); j < pts.length; j++) {
        const g0 = g(pts[j - 1]), g1 = g(pts[j]);
        if (g0 < 0 && g1 >= 0) {
          const t = g0 / (g0 - g1);
          return { j, p: [pts[j - 1][0] + t * (pts[j][0] - pts[j - 1][0]), pts[j - 1][1] + t * (pts[j][1] - pts[j - 1][1])] };
        }
      }
      return null;
    };
    const corner = (V, u1, u2) => {
      const c = Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1]));
      const d = r / Math.tan(Math.acos(c) / 2);
      return 'L' + pt([V[0] + u1[0] * d, V[1] + u1[1] * d]) + 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + pt([V[0] + u2[0] * d, V[1] + u2[1] * d]);
    };
    const up = [sa, -ca], down = [-sa, ca], right = [1, 0], left = [-1, 0];
    const paths = [];
    for (let i = 0; i < panels; i++) {
      const ox = i * P;
      const gL = (q) => q[0] - (ox + k * (H - q[1]));
      const gR = (q) => q[0] - (ox + W + k * (H - q[1]));
      const uPts = sample(ox - 40, ox + W + s + 40, -1);
      const uL = cross(uPts, gL, 1);
      const uR = uL && cross(uPts, gR, uL.j);
      const lPts = sample(ox - 40, ox + W + s + 40, 1);
      const lL = cross(lPts, gL, 1);
      const lR = lL && cross(lPts, gR, lL.j);
      if (!uR || !lR) { paths.push('', ''); continue; }
      let d = 'M' + pt(uL.p) + corner([ox + s, 0], down, right) + corner([ox + W + s, 0], left, down) + 'L' + pt(uR.p);
      for (let j = uR.j - 1; j >= uL.j; j--) d += 'L' + pt(uPts[j]);
      paths.push(d + 'Z');
      d = 'M' + pt(lR.p) + corner([ox + W, H], up, left) + corner([ox, H], right, up) + 'L' + pt(lL.p);
      for (let j = lL.j; j < lR.j; j++) d += 'L' + pt(lPts[j]);
      paths.push(d + 'Z');
    }
    return { paths, vw: (panels - 1) * P + W + s, vh: H };
  }

  renderVals() {
    const p = this.props;
    const o = {
      slant: p.slant ?? 19,
      panelWidth: p.panelWidth ?? 62,
      cut: p.cut ?? 7,
      amplitude: p.amplitude ?? 11,
      waveHeight: p.waveHeight ?? 47,
      cornerRadius: p.cornerRadius ?? 6
    };
    const main = this.buildMark(o, 2);
    const small = this.buildMark(Object.assign({}, o, { cut: Math.min(o.cut * 1.5, 12), cornerRadius: o.cornerRadius * 0.5 }), 2);
    const fav = this.buildMark(Object.assign({}, o, { cut: Math.min(o.cut * 1.6, 13), cornerRadius: o.cornerRadius * 0.5 }), 1);
    const r2 = (n) => Math.round(n * 100) / 100;
    const pack = (m) => ({ vb: '0 0 ' + r2(m.vw) + ' ' + m.vh, p1: m.paths[0], p2: m.paths[1], p3: m.paths[2] || '', p4: m.paths[3] || '' });
    const byH = (m, hh) => ({ w: r2(hh * m.vw / m.vh), h: hh });
    const byW = (m, ww) => ({ w: ww, h: r2(ww * m.vh / m.vw) });
    return {
      accent: p.accent ?? '#FFD12E',
      m: pack(main),
      ms: pack(small),
      mf: pack(fav),
      hero: byH(main, 228),
      mini: byH(main, 50),
      tile: byH(main, 110),
      icon: byW(main, 90),
      s40: byH(main, 40), s28: byH(main, 28), s20: byH(main, 20), s14: byH(main, 14),
      t40: byH(small, 40), t28: byH(small, 28), t20: byH(small, 20), t14: byH(small, 14),
      f32: byW(fav, 22),
      f16: byW(fav, 11)
    };
  }
}
</script>
