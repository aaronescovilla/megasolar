<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megasolar · Extended caps wordmarks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&amp;family=Geist:wght@400;500;600&amp;family=Michroma&amp;family=Oxanium:wght@600&amp;family=Russo+One&amp;family=Saira:wdth,wght@50..125,100..900&amp;family=Unbounded:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:#0C1014}a:hover{color:#5B6570}
</style>
</helmet>
<div style="width: 1600px; height: 1240px; box-sizing: border-box; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 16px; background: #E6E8E3; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0C1014">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
<div style="position: relative; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; min-width: 0">
<div style="position: absolute; top: 16px; left: 18px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: #5B6570">{{o.n}}</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 16px">
<div style="white-space: nowrap; line-height: 1; color: #0C1014; {{o.a.txt}}"><svg width="{{o.a.mw}}" height="{{o.a.mh}}" viewBox="{{o.vb}}" style="vertical-align: {{o.a.va}}px; margin-right: {{o.a.gap}}px" aria-hidden="true"><g fill="{{o.accent}}"><path d="{{o.p1}}"></path><path d="{{o.p2}}"></path><path d="{{o.p3}}"></path><path d="{{o.p4}}"></path></g></svg>MEGASOLAR</div>
</div>
<div style="display: flex; gap: 12px; margin: 0 16px">
<div style="flex: 1; height: 96px; border-radius: 14px; background: #0C1014; display: flex; align-items: center; justify-content: center">
<div style="white-space: nowrap; line-height: 1; color: #FFFFFF; {{o.b.txt}}"><svg width="{{o.b.mw}}" height="{{o.b.mh}}" viewBox="{{o.vb}}" style="vertical-align: {{o.b.va}}px; margin-right: {{o.b.gap}}px" aria-hidden="true"><g fill="{{o.accent}}"><path d="{{o.p1}}"></path><path d="{{o.p2}}"></path><path d="{{o.p3}}"></path><path d="{{o.p4}}"></path></g></svg>MEGASOLAR</div>
</div>
<div style="flex: 1; height: 96px; border-radius: 14px; background: {{o.accent}}; display: flex; align-items: center; justify-content: center">
<div style="white-space: nowrap; line-height: 1; color: #0C1014; {{o.b.txt}}"><svg width="{{o.b.mw}}" height="{{o.b.mh}}" viewBox="{{o.vb}}" style="vertical-align: {{o.b.va}}px; margin-right: {{o.b.gap}}px" aria-hidden="true"><g fill="#0C1014"><path d="{{o.p1}}"></path><path d="{{o.p2}}"></path><path d="{{o.p3}}"></path><path d="{{o.p4}}"></path></g></svg>MEGASOLAR</div>
</div>
</div>
<div style="padding: 14px 22px 18px; display: flex; align-items: baseline; gap: 12px">
<div style="font-size: 16px; font-weight: 600">{{o.name}}</div>
<div style="font-size: 13px; color: #5B6570">{{o.desc}}</div>
</div>
</div>
</sc-for>
</div>
</x-dc>

    const fonts = [
      { name: 'Michroma', desc: 'Closest to the reference: wide, squared, Microgramma-style', css: "font-family: 'Michroma', sans-serif; font-weight: 400;", ls: 0.02, F: 46, cap: 0.7 },
      { name: 'Saira SemiBold Expanded', desc: 'Squared and wide, a little softer', css: "font-family: 'Saira', sans-serif; font-weight: 600; font-stretch: 125%;", ls: 0.02, F: 58, cap: 0.7 },

    const lock = (fo, F) => {

    return { opts };

}
</script>
</body>
</html>
